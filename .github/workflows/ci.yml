name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행은 취소 (행사 준비 기간 러너 시간 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 로컬 개발 환경과 동일하게 고정
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test

      # 빌드는 Supabase 키 없이도 통과해야 한다.
      # 키가 없을 때 모듈 최상단에서 터지면 여기서 잡힌다.
      - name: Build
        run: npx next build
